# Dependabot configuration
# Automatically opens PRs to keep dependencies up-to-date.
# Docs: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2

updates:
  # ── Python (pip) ──────────────────────────────────────────────────────────
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "backend"
    open-pull-requests-limit: 5

  # ── Node / npm (frontend) ─────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/client"
    # CRA and its lint plugins require the TypeScript 6 JavaScript API.
    # typescript-native provides the TypeScript 7 project type-check command.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "component: frontend"
    open-pull-requests-limit: 5

  # ── GitHub Actions ────────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "ci"
    open-pull-requests-limit: 5
